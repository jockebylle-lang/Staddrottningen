<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Städdrottningen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e86a92">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Städdrottningen">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{--bg:#fff6f1;--panel:#ffffff;--panel2:#f4e8e2;--ink:#3b2f2a;--mute:#8a7a70;--accent:#e86a92;--accent2:#c94c76;--teal:#14a39a;--good:#2fa35a;--gold:#e8a400;--bad:#d9534f;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a1b;--panel:#2a2426;--panel2:#3a3134;--ink:#f3ece6;--mute:#b3a59a;--accent:#ff86ad;--accent2:#e86a92;--teal:#2cc4b9;--good:#5fd07a;--gold:#ffc83a;--bad:#ff6f69}}
:root[data-theme="dark"]{--bg:#1d1a1b;--panel:#2a2426;--panel2:#3a3134;--ink:#f3ece6;--mute:#b3a59a;--accent:#ff86ad;--accent2:#e86a92;--teal:#2cc4b9;--good:#5fd07a;--gold:#ffc83a;--bad:#ff6f69}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
body{max-width:520px;margin:0 auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 14px;min-height:46px;background:var(--panel2);color:var(--ink);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--accent);color:#fff}
.hide{display:none!important}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
h1{font-size:21px;margin:0;line-height:1.1}
.money{background:var(--panel);border-radius:999px;padding:7px 13px;font-weight:800;color:var(--good);white-space:nowrap;box-shadow:0 1px 4px #0001}
.note{font-size:13px;color:var(--mute);line-height:1.35}
.rank{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;margin:-2px 2px 8px}
.rank b{color:var(--accent2)}
#hub svg.scene{width:100%;display:block;border-radius:20px;box-shadow:0 4px 16px #0001}
.big{width:100%;min-height:58px;font-size:18px;margin-top:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.grid3 button{min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;background:var(--panel);box-shadow:0 1px 4px #0001}
.grid3 button span{font-size:26px}
.mini{min-height:36px;padding:4px 10px;font-size:16px;border-radius:999px;background:var(--panel);box-shadow:0 1px 4px #0001}
.goal{background:var(--panel);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.card{background:var(--panel);border-radius:16px;padding:12px;margin:8px 0;display:flex;gap:12px;align-items:center}
.card .ic{font-size:30px;width:42px;text-align:center;flex:0 0 auto;line-height:1}
.card .f1{flex:1;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;font-size:14px}
.tabs button.on{background:var(--accent);color:#fff}
.lv{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}.lv i{width:8px;height:8px;border-radius:50%;background:var(--panel2)}.lv i.on{background:var(--accent)}
.stars{color:var(--gold);letter-spacing:1px}
/* map */
#mapsvg{width:100%;display:block;border-radius:20px;box-shadow:0 4px 16px #0001}
.node{cursor:pointer}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.18);opacity:.4}}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);background:var(--panel);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px #0003;z-index:8}
.sheet h2{margin:0 0 4px;font-size:21px}
.sheet .rooms{font-size:22px;letter-spacing:2px;margin:6px 0}
.sheet .row{display:flex;gap:8px;margin-top:10px}
.sheet .row button{flex:1}
/* play */
#play{display:flex;flex-direction:column;align-items:center;gap:6px}
.hud{width:100%;display:flex;align-items:center;gap:8px}
.hud .f1{flex:1;min-width:0}
.room{font-weight:800;font-size:15px}
.bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .2s}
.time{font-weight:800;font-size:20px;min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.time.low{color:var(--bad)}
.phint{width:100%;display:flex;align-items:center;gap:6px;font-size:13px;min-height:34px}
.phint .t{background:var(--panel);border-radius:12px;padding:6px 10px;flex:1;line-height:1.25}
#cv{display:block;width:min(calc(100vw - 24px),420px,calc((100dvh - 285px)*.7826));aspect-ratio:360/460;border-radius:18px;touch-action:none;box-shadow:0 4px 18px #0002;background:#ccc}
.tools{display:flex;gap:5px;width:100%;overflow-x:auto;padding-bottom:2px;justify-content:center}
.tools button{flex:0 0 auto;min-width:60px;padding:5px 7px;font-size:10.5px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--panel)}
.tools button span{font-size:21px}
.tools button.on{background:var(--accent);color:#fff}
.nav{display:flex;gap:6px;width:100%}
.nav button{flex:1;font-size:14px}
/* socks */
#socks{display:flex;flex-direction:column;gap:8px}
.sgrid{display:grid;gap:7px;margin:0 auto;width:min(100%,calc((100dvh - 220px)*.8))}
.sc{aspect-ratio:4/5;border-radius:14px;padding:0;min-height:0;position:relative;perspective:600px;background:transparent}
.sc .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.sc.f .in{transform:rotateY(180deg)}
.sc .fa,.sc .ba{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.sc .ba{background:repeating-linear-gradient(45deg,#f7b6c8 0 8px,#fbd1dc 8px 16px);box-shadow:inset 0 0 0 3px #fff;font-size:22px}
.sc .fa{background:#fff;transform:rotateY(180deg);box-shadow:0 1px 4px #0002}
.sc.ok .fa{background:#e6f7ea}
.sc svg{width:72%;height:auto}
/* overlay */
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow-y:auto}
.box{background:var(--panel);border-radius:22px;padding:20px;max-width:380px;width:100%;text-align:center}
.box h2{margin:4px 0 6px;font-size:24px}
.box p{margin:6px 0;line-height:1.45}
.box .bigm{font-size:38px;font-weight:900;color:var(--good);margin:6px 0}
.box .r{display:flex;justify-content:space-between;font-size:15px;padding:4px 2px;border-bottom:1px solid #8882}
.box button{width:100%;margin-top:12px;min-height:52px;font-size:17px}
.box .st{font-size:34px;color:var(--gold);letter-spacing:4px}
#v10{display:flex;flex-direction:column;align-items:center;gap:7px}
.vtop{width:100%;display:flex;justify-content:space-between;align-items:center}
.vtop button{min-height:40px;padding:6px 12px;font-size:14px}
#vopp{display:flex;gap:8px;width:100%}
.vop{flex:1;text-align:center;padding:6px 4px;border-radius:14px;border:2px solid transparent;background:var(--panel)}
.vop.act{border-color:var(--accent)}
.vop .nm{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:700;margin-bottom:4px}
.vrow{display:flex;gap:8px;justify-content:center}
.vrow.s{gap:3px}
.pc{--w:min(14vw,56px);width:var(--w);aspect-ratio:5/7;background:#fff;color:#1e1e1a;border:1px solid #0003;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:calc(var(--w)*.34);transition:transform .08s;cursor:pointer}
.vrow.s .pc{--w:min(8.5vw,34px);border-radius:5px;cursor:default}
.pc b{font-size:1.1em}.pc.r{color:#c62828}
.pc.back{background:repeating-linear-gradient(45deg,#e86a92 0 5px,#f4a6c0 5px 10px)}
.pc.empty{background:transparent;border:2px dashed #8886}
.pc.stk{box-shadow:0 6px 0 -2px #e86a92}
.pc.sel{transform:translateY(-10px);outline:3px solid var(--teal)}
.pc.dim{opacity:.45}
.vmid{display:flex;gap:28px;justify-content:center;background:var(--panel);border-radius:14px;padding:8px 24px}
.vmid>div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute)}
#vmsg{min-height:36px;font-size:14px;text-align:center;max-width:420px}
#vhand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:28dvh;overflow-y:auto;padding:10px 4px 4px;max-width:440px}
.vbtns{display:flex;gap:8px}
.pet{cursor:pointer}
.pb{transform-box:fill-box;transform-origin:50% 100%}
.pb.bnc{animation:pbnc .6s}
@keyframes pbnc{30%{transform:translateY(-8px) scale(1.06)}65%{transform:translateY(0) scale(1.04,.95)}}
.wagt{transform-box:fill-box;transform-origin:0% 100%;animation:wagt 1.4s ease-in-out infinite}
@keyframes wagt{50%{transform:rotate(16deg)}}
.fh{transform-box:fill-box;animation:fh 1.2s ease-out forwards}
@keyframes fh{to{transform:translateY(-34px);opacity:0}}
#bike{display:flex;flex-direction:column;align-items:center;gap:8px}
#bcv{display:block;width:100%;aspect-ratio:360/300;border-radius:18px;touch-action:none;box-shadow:0 4px 18px #0002}
.letter{text-align:left;font-size:15.5px;line-height:1.55;background:#fff8fb;border-radius:14px;padding:14px 16px;margin-top:8px;color:#3b2f2a;border:2px dashed #f4a6c0}
.letter p{margin:0 0 10px}
.letter .sig{text-align:right;font-weight:800;margin:0}
.conf{position:fixed;top:-20px;width:9px;height:14px;border-radius:2px;z-index:11;pointer-events:none;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
#bbell.ring{background:#ffd34d;animation:ringb .5s ease-in-out infinite}
@keyframes ringb{50%{transform:scale(1.08) rotate(-3deg)}}
.unlock{background:#fff3c4;color:#6b4e00;border-radius:12px;padding:8px;margin-top:10px;font-weight:700}
</style>
</head>
<body>

<!-- HUB -->
<div id="hub" class="scr">
 <header><h1>👑 Städdrottningen</h1><div style="display:flex;gap:6px;align-items:center"><button class="mini" aria-label="Spara" onclick="openSave()">💾</button><button id="muteb" class="mini" aria-label="Ljud">🔊</button><div class="money"></div></div></header>
 <div class="rank" id="rank"></div>
 <svg class="scene" id="hubsvg" viewBox="0 0 360 330"></svg>
 <button class="pri big" id="tomap">🗺️ Gå till jobbet</button>
 <div class="grid3">
  <button id="toShop"><span>🧰</span>Städbutik</button>
  <button id="toHome"><span>🏠</span>Inred hemmet</button>
  <button id="toPets"><span>🐾</span>Husdjur</button>
  <button id="toHats"><span>🐸</span>Kvacks hattar</button>
  <button id="toV10"><span>🃏</span>Vänd 10</button>
  <button id="toWard"><span>👕</span>Garderob</button>
 </div>
 <div class="goal" id="goal"></div>
</div>

<!-- MAP -->
<div id="map" class="scr hide">
 <header><button id="mapback">← Hem</button><div class="money"></div></header>
 <svg id="mapsvg" viewBox="0 0 360 980"></svg>
 <button class="big" onclick="show('hub')">← Hem</button>
 <div style="height:160px" id="mappad"></div>
</div>
<div class="sheet hide" id="sheet"></div>

<!-- PLAY -->
<div id="play" class="scr hide">
 <div class="hud"><div class="f1"><div class="room" id="rName"></div><div class="bar"><i id="rBar"></i></div><div class="note" id="rInfo"></div></div><div class="time" id="time"></div></div>
 <div class="phint"><svg viewBox="-28 -34 56 62" width="34" height="38" id="pfrog"></svg><div class="t" id="phint"></div></div>
 <canvas id="cv" width="360" height="460"></canvas>
 <div class="tools" id="tools"></div>
 <div class="nav" id="nav"><button id="prev">◀ Rum</button><button id="next">Rum ▶</button><button id="done" class="pri">✔ Lämna in</button></div>
</div>

<!-- BIKE -->
<div id="bike" class="scr hide">
 <div class="hud"><div class="f1"><div class="room" id="bName"></div><div class="bar"><i id="bBar"></i></div><div class="note" id="bInfo"></div></div><div class="time" id="bCoins"></div></div>
 <div class="phint"><svg viewBox="-28 -34 56 62" width="34" height="38" id="bfrog"></svg><div class="t" id="bhint"></div></div>
 <canvas id="bcv"></canvas>
 <div class="nav"><button id="bjump" class="pri" style="flex:2;min-height:64px;font-size:18px">⬆️ Hoppa</button><button id="bbell" style="min-height:64px">🔔 Plingeling</button></div>
</div>

<!-- SOCKS -->
<div id="socks" class="scr hide">
 <div class="hud"><div class="f1"><div class="room" id="sName"></div><div class="note" id="sInfo"></div></div><div class="time" id="sTime"></div></div>
 <div class="phint"><svg viewBox="-28 -34 56 62" width="34" height="38" id="sfrog"></svg><div class="t">Kvack! Hitta strumpor som hör ihop. Tryck på två kort i taget.</div></div>
 <div class="sgrid" id="sgrid"></div>
</div>

<!-- VÄND 10 -->
<div id="v10" class="scr hide">
 <div class="vtop"><button id="v10back">← Hem</button><b>🃏 Vänd 10</b><button id="v10rules">Regler</button></div>
 <div id="vopp"></div>
 <div class="vmid" id="vmid"></div>
 <div id="vmsg"></div>
 <div id="vmy"></div>
 <div id="vhand"></div>
 <div class="vbtns" id="vbtns"></div>
</div>

<!-- SHOP -->
<div id="shop" class="scr hide">
 <header><button id="shopback">← Hem</button><div class="money"></div></header>
 <div class="tabs" id="stabs"></div>
 <div id="slist"></div>
</div>

<div class="ov hide" id="ov"></div>

 if(th.pat=='dots')for(let y=12;y<200;y+=24)for(let x=(y/24%2)*12+6;x<360;x+=24)s+=`<circle cx="${x}" cy="${y}" r="3" fill="#fff" opacity=".6"/>`;
 if(th.pat=='flowers')for(let y=18;y<200;y+=36)for(let x=(y/36%2)*24+12;x<360;x+=48)s+=`<text x="${x}" y="${y}" font-size="11" opacity=".35" text-anchor="middle">✿</text>`;
 if(th.pat=='stone')for(let y=0;y<200;y+=22)for(let x=-(y/22%2)*22;x<360;x+=44)s+=`<rect x="${x+1}" y="${y+1}" width="42" height="20" rx="3" fill="#f5efe4" stroke="#d8ccb8"/>`;
 if(H==4)s+=`<path d="M140 120 V60 Q190 6 240 60 V120 Z" fill="#fff"/><g clip-path="url(#wclip)">${viewSVG(th.view,140,10,100,110)}</g><path d="M140 120 V60 Q190 6 240 60 V120 Z" fill="none" stroke="#c9b48a" stroke-width="7"/><path d="M190 18 V120 M140 74 H240" stroke="#c9b48a" stroke-width="4"/>`;
 else{const w=70+H*10,h=64+H*6,x=190-w/2;s+=`<g clip-path="url(#wclip)">${viewSVG(th.view,x,24,w,h)}</g><rect x="${x}" y="24" width="${w}" height="${h}" rx="8" fill="none" stroke="#fff" stroke-width="6"/><path d="M${x} ${24+h/2} h${w} M190 24 v${h}" stroke="#fff" stroke-width="4"/><rect x="${x-6}" y="${24+h}" width="${w+12}" height="6" rx="3" fill="#fff"/>`;if(H>=1)s+=`<path d="M${x-10} 18 q10 ${h/2} 0 ${h+12}" stroke="#f4a6b8" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M${x+w+10} 18 q-10 ${h/2} 0 ${h+12}" stroke="#f4a6b8" stroke-width="12" fill="none" stroke-linecap="round"/>`}
 s+=`<rect y="200" width="360" height="130" fill="${th.floor}"/><rect y="197" width="360" height="5" fill="#fff" opacity=".6"/>`;
 if(H==4)for(let x=0;x<360;x+=40)for(let y=202;y<330;y+=40)s+=`<rect x="${x}" y="${y}" width="40" height="40" fill="${(x+y)%80?'#e4dccd':'#f6f1e8'}"/>`;
 else for(let y=212;y<330;y+=16)s+=`<path d="M0 ${y} h360" stroke="#00000014"/>`;
 if(G.furn.soffa||G.furn.sang)s+=`<ellipse cx="236" cy="266" rx="${80+H*6}" ry="22" fill="${['#f4c3a0','#f7b6c8','#b8d8f0','#c9b5ec','#e8b92e'][H]}" opacity=".55"/>`;
 for(const f of['vagg','hylla','mys','ljus','sang','soffa','gront','kvack'])s+=furnSVG(f,G.furn[f]||0);
 s+=`<rect x="6" y="6" width="${HOMES[H].n.length*7+28}" height="22" rx="11" fill="#fff" opacity=".85"/><text x="16" y="21" font-size="12" font-weight="800" fill="#3b2f2a">🏠 ${HOMES[H].n}</text>`;
 s+=`<g transform="translate(-6 88) scale(.7)">${fannySVG({crown:totalStars()>=75})}</g>`;
 s+=petsSVG();
 return s;
}

/* ================= SCREENS ================= */
let scr='hub';
function show(s){scr=s;for(const id of['hub','map','play','socks','shop','v10','bike'])$(id).classList.toggle('hide',id!=s);$('sheet').classList.add('hide');if(s=='hub')renderHub();if(s=='map')renderMap();renderMoney();window.scrollTo&&window.scrollTo(0,0);if(s=='map')scrollToLast()}
function renderMoney(){document.querySelectorAll('.money').forEach(e=>e.textContent='💰 '+fmt(G.money)+' kr')}
function renderHub(){
 maybePee();
 const ts=totalStars();
 $('rank').innerHTML=`<span>Titel: <b>${rankOf(ts)}</b></span><span class="stars">⭐ ${ts}/${JOBS.length*3}</span>`;
 $('hubsvg').innerHTML=hubSVG();
 const items=[];
 TOOLS.forEach(t=>{if(!G.tools[t.id])items.push([t.n,t.p])});
 UPG.forEach(u=>{const l=lv(u.id);if(l<u.p.length)items.push([u.n,u.p[l]])});
 if(G.home<4)items.push([HOMES[G.home+1].n,HOMES[G.home+1].p]);
 FURN.forEach(f=>{const l=G.furn[f.id]||0;if(l<3&&(f.t[l][2]||0)<=G.home)items.push([f.t[l][0],f.t[l][1]])});
 PETS.forEach(p=>{if(!G.pets[p.id])items.push([p.n+' '+p.name,p.p])});
 OUTFITS.forEach(o=>{if(!G.wear[o.id])items.push([o.n,o.p])});
 items.sort((a,b)=>a[1]-b[1]);
 $('muteb').textContent=G.mute?'🔇':'🔊';
 const nr=REG.find(r=>r.req>ts);
 $('goal').innerHTML=`${STORE_OK?'':'<div style="color:#b3392d;margin-bottom:6px"><b>⚠️ Spelet kan inte sparas i den här webbläsaren.</b> Tryck på 💾 uppe till höger.</div>'}<b>🐸 Kvack tipsar:</b> ${items.length?`Spara till <b>${items[0][0]}</b> (${fmt(items[0][1])} kr).`:'Du har köpt allt! Du är en riktig drottning.'}${nr?` Samla ${nr.req-ts} ⭐ till för att låsa upp <b>${nr.n}</b>.`:''}${G.endSeen?'<br><button class="mini" style="margin-top:8px" onclick="showLetter()">💌 Läs brevet från Jocke igen</button>':''}${G.pud&&G.pud.length?'<br>💦 <b>Oj! Sally har kissat inne.</b> Tryck på pölen för att torka upp.':Object.keys(G.pets).length?'<br>💕 Tryck på husdjuren för att klappa dem!':''}`;
}

let selJob=null;
function mapSVG(){
 const ts=totalStars();
 let s=`<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6f0c2"/><stop offset="1" stop-color="#bfe6a3"/></linearGradient></defs><rect width="360" height="${MAPH}" fill="url(#gr)"/>`;
 REG.forEach((r,i)=>{
  s+=`<rect x="8" y="${r.y0}" width="344" height="${r.y1-r.y0}" rx="22" fill="${r.c}" opacity=".6"/>`;
  s+=`<rect x="16" y="${r.y0+7}" width="${r.n.length*8+44}" height="24" rx="12" fill="#fff" opacity=".95"/><text x="26" y="${r.y0+24}" font-size="13.5" font-weight="800" fill="#3b2f2a">${r.ic} ${r.n}</text>`;
  const dd=[[i%2?82:278,r.y1-12],[180,r.y1-104],[i%2?334:26,r.y1-112]];
  dd.forEach((p,k)=>s+=`<text x="${p[0]}" y="${p[1]}" font-size="${k==2?24:16}" text-anchor="middle" dominant-baseline="central" opacity=".85">${r.d[k]}</text>`);
  if(i<REG.length-1)s+=`<text x="${i%2?36:324}" y="${r.y0-4}" font-size="9" font-weight="800" fill="#6b8f4e" text-anchor="middle">🚂</text>`;
 });
 let d='';JOBS.forEach((j,i)=>{const p=j.pos;if(!i)d=`M${p[0]} ${p[1]}`;else{const q=JOBS[i-1].pos;d+=` Q${(q[0]+p[0])/2+((i%2)?14:-14)} ${(q[1]+p[1])/2} ${p[0]} ${p[1]}`}});
 s+=`<path d="${d}" stroke="#d9b48a" stroke-width="9" fill="none" stroke-linecap="round" opacity=".8"/><path d="${d}" stroke="#fff" stroke-width="2.5" fill="none" stroke-dasharray="3 8" stroke-linecap="round"/>`;
 JOBS.forEach(j=>{
  const [x,y]=j.pos,open=regOpen(j.reg),st=G.stars[j.id]||0,b=!!j.bonus,sel=selJob==j.id;
  s+=`<g class="node" onclick="pickJob('${j.id}')">`;
  if(sel)s+=`<circle cx="${x}" cy="${y}" r="27" fill="#fff" class="pulse"/>`;
  s+=`<circle cx="${x}" cy="${y+3}" r="21" fill="#0002"/><circle cx="${x}" cy="${y}" r="21" fill="${b?'#fff4c2':'#fff'}" stroke="${!open?'#bbb':b?'#e8a400':'#e86a92'}" stroke-width="3.5"/>`;
  s+=`<text x="${x}" y="${y+1}" font-size="19" text-anchor="middle" dominant-baseline="central" opacity="${open?1:.35}">${j.ic}</text>`;
  if(b&&open)s+=`<rect x="${x-17}" y="${y-31}" width="34" height="12" rx="6" fill="#e8a400"/><text x="${x}" y="${y-22}" font-size="7.5" font-weight="900" fill="#fff" text-anchor="middle">BONUS</text>`;
  if(open)s+=`<rect x="${x-19}" y="${y+16}" width="38" height="13" rx="6.5" fill="#fff"/><text x="${x}" y="${y+26}" font-size="10" text-anchor="middle" fill="#e8a400">${'★'.repeat(st)}<tspan fill="#d8cfc6">${'★'.repeat(3-st)}</tspan></text>`;
  s+=`</g>`;
 });
 REG.forEach(r=>{if(ts<r.req){s+=`<rect x="8" y="${r.y0}" width="344" height="${r.y1-r.y0}" rx="22" fill="#fff" opacity=".55" pointer-events="none"/><g pointer-events="none"><rect x="${180-64}" y="${(r.y0+r.y1)/2-15}" width="128" height="30" rx="15" fill="#3b2f2a" opacity=".85"/><text x="180" y="${(r.y0+r.y1)/2+5}" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">🔒 ${r.req} ⭐ behövs</text></g>`}});
 const lj=JOBS.find(j=>j.id==G.last)||JOBS[0];
 s+=`<g transform="translate(${lj.pos[0]+24} ${lj.pos[1]-20}) scale(.5)" pointer-events="none">${frogSVG()}</g>`;
 return s;
}
function renderMap(){$('mapsvg').setAttribute('viewBox',`0 0 360 ${MAPH}`);$('mapsvg').innerHTML=mapSVG()}
function scrollToLast(){const sv=$('mapsvg'),r=sv.getBoundingClientRect(),k=r.width/360,lj=JOBS.find(j=>j.id==G.last)||JOBS[0];window.scrollTo(0,Math.max(0,r.top+window.scrollY+lj.pos[1]*k-innerHeight*.5))}
function pickJob(id){
 const j=JOBS.find(q=>q.id==id);selJob=id;renderMap();
 if(!regOpen(j.reg)){$('sheet').innerHTML=`<h2>🔒 ${REG[j.reg].n}</h2><p class="note">Samla ${REG[j.reg].req} stjärnor för att låsa upp området. Du har ${totalStars()} ⭐.</p><div class="row"><button onclick="closeSheet()">Okej</button></div>`;$('sheet').classList.remove('hide');return}
 const st=G.stars[j.id]||0;let info='';
 if(j.bonus=='window')info=`<p class="note"><b>Bonusbana: Fönsterputs!</b> Som ett riktigt fönsterputsarproffs: 1) svabba glaset med såpvatten, 2) dra av skummet med gummiskrapan, 3) klicka bort flugskiten med klickskrapan.</p><p class="note">⏱ ${j.t} s · upp till ${fmt(j.pay*payMult()*1.25)} kr</p>`;
 else if(j.bonus=='bike')info=`<p class="note"><b>Bonusbana: Cykeltur!</b> Fanny cyklar till jobbet på sin rosa cykel med Kvack i korgen. Tryck för att hoppa över hinder och samla mynt. 🔔 schasar bort djur från vägen.</p><p class="note">Upp till ${fmt(j.pay*payMult()*1.25)} kr</p>`;
 else if(j.bonus=='socks')info=`<p class="note"><b>Bonusbana: Strumpjakt!</b> Tvätten har blandats ihop. Hitta ${j.pairs} strumppar innan tiden tar slut.</p><p class="note">⏱ ${j.t+lv('korg')*10} s · upp till ${fmt(j.pay*payMult()*1.5)} kr</p>`;
 else{const ex=[];if(j.party||j.tr>=10)ex.push('mycket skräp');if(j.web>=3)ex.push('massor av spindelnät');if(j.lvl>=4)ex.push('envisa fläckar');
  info=`<div class="rooms">${j.rooms.map(r=>ROOMS[r].f[0][4]).join(' ')}</div><p class="note">${j.rooms.length} rum · ⏱ ${j.t+lv('tid')*15} s · upp till ${fmt(j.pay*payMult()*1.3)} kr${ex.length?' · '+ex.join(', '):''}</p>`}
 $('sheet').innerHTML=`<h2>${j.ic} ${j.n}</h2><div class="stars" style="font-size:20px">${'★'.repeat(st)}<span style="color:#d8cfc6">${'★'.repeat(3-st)}</span></div>${info}<div class="row"><button onclick="closeSheet()">Avbryt</button><button class="pri" onclick="startJob('${j.id}')">${j.bonus?'Spela':'Städa'}!</button></div>`;
 $('sheet').classList.remove('hide');
}
function closeSheet(){$('sheet').classList.add('hide');selJob=null;renderMap()}

 const T={clean:['🧹 Redskap','✨ Uppgraderingar'],home:['🏠 Bostad','🛋️ Möbler'],hats:['🐸 Kvacks hattar'],pets:['🐾 Husdjur'],ward:['👕 Kläder','🧢 Huvud']}[shopKind];

 let s='';

 const dots=(l,n)=>n>1?`<span class="lv">${Array.from({length:n},(_,k)=>`<i class="${k<l?'on':''}"></i>`).join('')}</span>`:'';
 if(shopKind=='clean'&&shopTab==0)for(const t of TOOLS){const own=G.tools[t.id];s+=`<div class="card"><div class="ic">${t.ic}</div><div class="f1"><b>${t.n}</b><div class="note">${t.d}<br>Storlek ${t.r} · kraft ${t.s}</div></div>${own?`<button ${G.tool==t.id?'class="pri"':''} onclick="G.tool='${t.id}';save();renderShop()">${G.tool==t.id?'Vald':'Välj'}</button>`:btn(t.p,1,`buyTool('${t.id}')`)}</div>`}

 if(shopKind=='home'&&shopTab==0)HOMES.forEach((h,i)=>{s+=`<div class="card"><div class="ic">${['🛏️','🏠','🏘️','🏡','🏰'][i]}</div><div class="f1"><b>${h.n}</b><div class="note">${['Där allt började.','Mer plats och gardiner!','Eget hus med prickiga tapeter.','Stor villa med havsutsikt.','Ett riktigt slott för en drottning!'][i]}</div></div>${i<=G.home?`<button disabled>${i==G.home?'Ditt hem':'✓'}</button>`:i==G.home+1?btn(h.p,1,`buyHome()`):`<button disabled>🔒</button>`}</div>`});
 if(shopKind=='home'&&shopTab==1)for(const f of FURN){const l=G.furn[f.id]||0,mx=l>=3,nx=f.t[l],lock=!mx&&(nx[2]||0)>G.home;s+=`<div class="card"><div class="ic">${['🛏️','🛋️','💀','💡','📚','🪴','📺','🐸'][FURN.indexOf(f)]}</div><div class="f1"><b>${f.n}</b>${dots(l,3)}<div class="note">${l?`Nu: ${f.t[l-1][0]}.`:'Tomt.'} ${mx?'Fullt uppgraderad!':`Nästa: <b>${nx[0]}</b>${lock?` (kräver ${HOMES[nx[2]].n})`:''}`}</div></div>${mx?'<button disabled>✓</button>':btn(nx[1],!lock,`buyFurn('${f.id}')`)}</div>`}
 if(shopKind=='hats')for(const h of HATS){const own=G.hats[h.id];s+=`<div class="card"><div class="ic"><svg viewBox="-28 -38 56 64" width="44" height="50">${frogSVG(h.id)}</svg></div><div class="f1"><b>${h.n}</b><div class="note">${own?(G.hat==h.id?'Kvack har på sig den här.':'Du äger den här.'):'Kvack skulle bli så glad!'}</div></div>${own?`<button ${G.hat==h.id?'class="pri"':''} onclick="G.hat='${h.id}';save();renderShop()">${G.hat==h.id?'På':'Ta på'}</button>`:btn(h.p,1,`buyHat('${h.id}')`)}</div>`}
 if(shopKind=='ward'&&shopTab==0)for(const o of OUTFITS){const own=G.wear[o.id];s+=`<div class="card"><div class="ic" style="width:56px"><svg viewBox="10 0 180 300" width="54" height="90">${fannySVG({outfit:o.id})}</svg></div><div class="f1"><b>${o.n}</b><div class="note">${o.d}</div></div>${own?`<button ${G.outfit==o.id?'class="pri"':''} onclick="G.outfit='${o.id}';save();renderShop()">${G.outfit==o.id?'På':'Ta på'}</button>`:btn(o.p,1,`buyOutfit('${o.id}')`)}</div>`}

function drawDirt(r){

  const du=r.dust[i],s=r.st[i],fo=F?F[i]:0,o=i*4;
  if(du<=0&&s<=0&&fo<=0){d[o+3]=0;continue}
  let pr=0,pg=0,pb=0,pa=0;
  const lay=(a,c0,c1,c2)=>{pr=c0*a+pr*(1-a);pg=c1*a+pg*(1-a);pb=c2*a+pb*(1-a);pa=a+pa*(1-a)};
  if(du>0)lay(Math.min(1,du)*.78,128,116,98);
  if(s>0){const c=STC[r.sc[i]];lay(.35+.6*Math.min(1,s),c[0],c[1],c[2])}

  d[o]=pr/pa;d[o+1]=pg/pa;d[o+2]=pb/pa;d[o+3]=pa*255;

function sockSVG(d){

 if(p==0)pat=[8,15,22].map(y=>`<rect x="12" y="${y}" width="16" height="3.5" fill="#fff" opacity=".85"/>`).join('');

function startSocks(j){
